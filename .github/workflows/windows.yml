name: Windows (beta)
on:
  push:
    branches: [master]
    paths: ["windows/**", ".github/workflows/windows.yml"]
    tags: ["windows-v*"]
  pull_request:
    paths: ["windows/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: windows } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet test tests/Coremium.Core.Tests
      - run: dotnet publish src/Coremium.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/win-x64
      - name: Package
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_NAME -like 'windows-v*') { $env:GITHUB_REF_NAME.Substring(9) } else { 'dev' }
          Compress-Archive -Path dist/win-x64/Coremium.exe -DestinationPath "dist/Coremium-Windows-$v-x64.zip"
          $hash = (Get-FileHash "dist/Coremium-Windows-$v-x64.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/Coremium-Windows-$v-x64.sha256", "$hash  Coremium-Windows-$v-x64.zip`n")
      - uses: actions/upload-artifact@v4
        with: { name: coremium-windows, path: "windows/dist/*.zip" }
      - if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            windows/dist/*.zip
            windows/dist/*.sha256
